<!DOCTYPE html>
<html lang="en" data-palette="sandstone">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Sheet 1.0</title>
    <link rel="stylesheet" href="../style.css?v=2026111105">
</head>

<body>
    <main class="cs">
        <div class="cs-topbar">
            <nav aria-label="Page navigation">
                <a class="contents-link" href="../world.html">The World</a>
            </nav>
            <div class="cs-file">
                <button type="button" class="cs-btn" id="cs-save">Save sheet</button>
                <label class="cs-btn cs-load" style="display: inline-flex; align-items: center;">Load sheet<input type="file" id="cs-load" accept=".json,application/json"></label>
                <p class="cs-file-msg" id="cs-file-msg" role="status"></p>
            </div>
        </div>

        <header class="cs-header">
            <h1 class="cs-title">Character Sheet</h1>
            <div class="cs-name-row">
                <label for="cs-name" class="cs-label" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Character name</label>
                <input id="cs-name" class="cs-name" type="text" data-field="name" placeholder="Character name" autocomplete="off">
                <div class="cs-stepper" role="group" aria-label="Level">
                    <span class="cs-soft">Level</span>
                    <button type="button" class="cs-btn" id="cs-level-down" aria-label="Lower level">−</button>
                    <span class="cs-level-value" id="cs-level" aria-live="polite">1</span>
                    <button type="button" class="cs-btn" id="cs-level-up" aria-label="Raise level">+</button>
                </div>
            </div>
            <p class="cs-summary" id="cs-summary"></p>
        </header>

        <section class="cs-vitals" aria-label="Hit Points and Armor Class">
            <div class="cs-hp">
                <span class="cs-key">HP</span>
                <button type="button" class="cs-btn" id="cs-hp-down" aria-label="Lose 1 Hit Point">−</button>
                <div class="cs-hp-body">
                    <span class="cs-big" aria-live="polite"><span id="cs-hp-now"></span> <span class="cs-soft">/ <span id="cs-hp-max"></span></span></span>
                    <span class="cs-bar"><span id="cs-hp-bar"></span></span>
                </div>
                <button type="button" class="cs-btn" id="cs-hp-up" aria-label="Recover 1 Hit Point">+</button>
            </div>
            <div class="cs-ac">
                <span class="cs-key">AC</span>
                <span class="cs-big" id="cs-ac"></span>
                <span class="cs-soft" id="cs-ac-source"></span>
                <label for="cs-armor" class="cs-label" style="margin-left: 0.5rem;">Armor</label>
                <input id="cs-armor" class="cs-armor" type="text" inputmode="numeric" data-field="armor" placeholder="none">
            </div>
        </section>

        <div class="cs-row">
            <section aria-labelledby="cs-char-h">
                <h2 id="cs-char-h">Character</h2>
                <div class="cs-fields">
                    <div class="cs-field"><label for="cs-race">Race</label><select id="cs-race" data-field="race"></select></div>
                    <div class="cs-field"><label for="cs-class">Class</label><select id="cs-class" data-field="cls"></select></div>
                </div>
                <div class="cs-box" id="cs-ilie" hidden>
                    <label class="cs-check"><input type="checkbox" id="cs-transformed"> Born into another race, then became an Ilie</label>
                    <div id="cs-ilie-options" hidden>
                        <div class="cs-field"><label for="cs-birth">Birth race</label><select id="cs-birth" data-field="birth"></select></div>
                        <div class="cs-choice" role="group" aria-label="Lingering Blood" style="margin-top: 0.75rem;">
                            <button type="button" class="cs-btn" id="cs-blood-full">Full Ilie</button>
                            <button type="button" class="cs-btn" id="cs-blood-ling">Lingering Blood</button>
                        </div>
                        <p class="cs-meta" id="cs-blood-note" style="margin: 0.5rem 0 0;"></p>
                    </div>
                </div>
                <div class="cs-fields">
                    <div class="cs-field"><label for="cs-align">Alignment</label><select id="cs-align" data-field="align"></select></div>
                    <div class="cs-field"><label for="cs-social">Social class</label><select id="cs-social" data-field="social"></select></div>
                    <div class="cs-field"><label for="cs-age">Age and sex</label><input id="cs-age" type="text" data-field="age"></div>
                    <div class="cs-field"><label for="cs-player">Player</label><input id="cs-player" type="text" data-field="player"></div>
                </div>
            </section>

            <section aria-labelledby="cs-attr-h">
                <h2 id="cs-attr-h"><span>Attributes <span class="cs-soft" style="color: var(--ink-soft);">· calculated</span></span></h2>
                <div class="cs-attrs" id="cs-attrs"></div>
                <p class="cs-meta" id="cs-no-magic" style="margin: 0;">Only Mages and Warlocks wield magic: the Magic Tree appears when one of those classes is chosen.</p>
            </section>
        </div>

        <div class="cs-row" id="cs-magic" hidden>
            <section aria-labelledby="cs-tree-h">
                <h2 id="cs-tree-h">Magic Tree <span class="cs-soft" id="cs-points"></span></h2>
                <div class="cs-list" id="cs-branches"></div>
            </section>

            <section aria-labelledby="cs-spells-h">
                <h2 id="cs-spells-h">Known Spells</h2>
                <div class="cs-box cs-learn-box">
                    <button type="button" class="cs-learn-toggle" id="cs-learn-toggle" aria-expanded="false" aria-controls="cs-learn">Learn a new spell <span aria-hidden="true" id="cs-learn-icon">+</span></button>
                    <div class="cs-learn" id="cs-learn" hidden>
                        <div class="cs-fields" style="grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 0.6rem;">
                            <div class="cs-field"><label for="cs-new-branch">Branch</label><select id="cs-new-branch"></select></div>
                            <div class="cs-field"><label for="cs-new-spell">Spell</label><select id="cs-new-spell"></select></div>
                        </div>
                        <div id="cs-custom" class="cs-fields" style="grid-template-columns: minmax(0, 1fr) 7rem; gap: 0.6rem;" hidden>
                            <div class="cs-field"><label for="cs-new-name">Name</label><input id="cs-new-name" type="text"></div>
                            <div class="cs-field"><label for="cs-new-tier">Tier</label>
                                <select id="cs-new-tier"><option value="1">I</option><option value="2">II</option><option value="3">III</option><option value="4">IV</option><option value="5">V</option></select>
                            </div>
                        </div>
                        <button type="button" class="cs-btn" id="cs-add-spell" style="align-self: flex-start;">Add spell</button>
                    </div>
                </div>
                <div class="cs-list" id="cs-spells"></div>
            </section>
        </div>

        <div class="cs-row">
            <section aria-labelledby="cs-eq-h">
                <h2 id="cs-eq-h">Equipment</h2>
                <div class="cs-list" id="cs-items"></div>
                <div class="cs-add">
                    <div class="cs-field"><label for="cs-new-item">New item</label><input id="cs-new-item" type="text" placeholder="Rope, lantern, dagger…"></div>
                    <button type="button" class="cs-btn" id="cs-add-item">Add</button>
                </div>
            </section>

            <section aria-labelledby="cs-coin-h">
                <h2 id="cs-coin-h">Wealth</h2>
                <div class="cs-list" id="cs-coins"></div>
            </section>
        </div>

        <section aria-labelledby="cs-story-h" style="display: flex; flex-direction: column; gap: 0.9rem;">
            <h2 id="cs-story-h">Story and Notes</h2>
            <div class="cs-story-grid">
                <div class="cs-field cs-wide"><label for="cs-look">Appearance</label><textarea id="cs-look" rows="3" data-field="look"></textarea></div>
                <div class="cs-field"><label for="cs-story">Backstory</label><textarea id="cs-story" rows="7" data-field="story"></textarea></div>
                <div class="cs-field"><label for="cs-notes">Notes</label><textarea id="cs-notes" rows="7" data-field="notes"></textarea></div>
            </div>
        </section>
    </main>

    <script src="../markdown.js?v=2026110201"></script>
    <script src="../characterSheet.js?v=2026110201"></script>
</body>
</html>
