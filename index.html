<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book of Ixoria</title>
    <link rel="stylesheet" href="style.css?v=2026111102">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&display=swap">
    <style>
        /* Front page: two tarot cards, one for the world and one for the chronicles */
        main.deck { max-width: 64rem; text-align: center; }
        main.deck h1 { border-bottom: 0; margin-bottom: 0.4rem; padding-bottom: 0; }
        .deck-intro { margin: 0 0 2.5rem; color: var(--ink-soft); letter-spacing: 0.08em; }
        .spread { display: flex; flex-wrap: wrap; justify-content: center; gap: 2.5rem; }
        .card-link { display: block; width: min(22rem, 100%); border-radius: 12px; transition: transform .3s ease; }
        .card-link:hover, .card-link:focus-visible { transform: translateY(-8px); }
        .card-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
        .tarot { display: block; width: 100%; height: auto; filter: drop-shadow(0 16px 30px rgba(0,0,0,.55)); }
        .tarot-type { font-family: "IM Fell English SC", "Palatino Linotype", "Book Antiqua", Georgia, serif; }

  .layer { transform-box: view-box; transform-origin: 0 0; animation: spin linear infinite; }
  .l1 { animation-duration: 140s; }
  .l2 { animation-duration: 90s; animation-direction: reverse; }
  .l3 { animation-duration: 60s; }
  .l4 { animation-duration: 120s; animation-direction: reverse; }
  .rim { animation-duration: 120s; }
  .m1 { animation-duration: 200s; animation-direction: reverse; }
  .m2 { animation-duration: 150s; }
  .m3 { animation-duration: 180s; }
  .shadow { animation: phase 40s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes phase {
    0%, 8%   { transform: translateX(268px); }
    50%      { transform: translateX(0); }
    92%, 100% { transform: translateX(-268px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .layer { animation: none; }
    .shadow { animation: none; transform: translateX(170px); }
  }

        @media (prefers-reduced-motion: reduce) { .card-link { transition: none; } }
    </style>
</head>
